<svg role="img" aria-label="Measured: time to lock within ±0.1 cent on a clean tone (median, ms)" id="d-tuner-lock" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 700px;" viewBox="0 0 700 500" role="graphics-document document" aria-roledescription="xychart"><style>#d-tuner-lock{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:16px;fill:#1C160E;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#d-tuner-lock .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#d-tuner-lock .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#d-tuner-lock .error-icon{fill:hsl(222.8571428571, 30.4347826087%, 100%);}#d-tuner-lock .error-text{fill:#000000;stroke:#000000;}#d-tuner-lock .edge-thickness-normal{stroke-width:1px;}#d-tuner-lock .edge-thickness-thick{stroke-width:3.5px;}#d-tuner-lock .edge-pattern-solid{stroke-dasharray:0;}#d-tuner-lock .edge-thickness-invisible{stroke-width:0;fill:none;}#d-tuner-lock .edge-pattern-dashed{stroke-dasharray:3;}#d-tuner-lock .edge-pattern-dotted{stroke-dasharray:2;}#d-tuner-lock .marker{fill:#6B5B3E;stroke:#6B5B3E;}#d-tuner-lock .marker.cross{stroke:#6B5B3E;}#d-tuner-lock svg{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:16px;}#d-tuner-lock p{margin:0;}#d-tuner-lock .node .neo-node{stroke:#1C160E;}#d-tuner-lock [data-look="neo"].node rect,#d-tuner-lock [data-look="neo"].cluster rect,#d-tuner-lock [data-look="neo"].node polygon{stroke:url(#d-tuner-lock-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#d-tuner-lock [data-look="neo"].swimlane.cluster rect{filter:none;}#d-tuner-lock [data-look="neo"].node path{stroke:url(#d-tuner-lock-gradient);stroke-width:1px;}#d-tuner-lock [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#d